<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Trainer</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23779556'/%3E%3Cpath d='M16 5a3 3 0 0 1 1.8 5.4c2.2 1.1 3.7 3.3 3.7 5.9 0 1.8-.7 3.2-1.6 4.2h-7.8c-.9-1-1.6-2.4-1.6-4.2 0-2.6 1.5-4.8 3.7-5.9A3 3 0 0 1 16 5z' fill='%23ebecd0'/%3E%3Cpath d='M11 21.5h10l1 3H10z' fill='%23ebecd0'/%3E%3Cpath d='M9 25.5h14V28H9z' fill='%23ebecd0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/chessboard.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/markers/markers.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/arrows/arrows.css">
<link rel="stylesheet" href="vendor/cm-chessboard/assets/extensions/promotion-dialog/promotion-dialog.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="openings">

<header id="top">
  <div class="brand">Chess&nbsp;Trainer</div>
  <span id="version" class="version" title="Build version"></span>
  <button id="btn-warming" class="ghost power" aria-pressed="true"
          title="Background analysis. Off frees the processor at once; your own moves are still graded."></button>
  <div class="top-actions">
    <button id="btn-library" class="ghost">Games played</button>
    <button id="btn-game" class="ghost">Game</button>
    <button id="btn-stats" class="ghost">Stats</button>
    <button id="btn-help" class="ghost" aria-label="Help and statistics">?</button>
    <div class="menu-wrap">
      <button id="btn-chain" class="chip quiet" aria-haspopup="true"
              title="How many moves in a row you must find"></button>
      <ul id="chain-list" class="dropdown" hidden></ul>
    </div>
    <div class="menu-wrap">
      <button id="btn-mode" class="chip" aria-haspopup="true"></button>
      <ul id="mode-list" class="dropdown" hidden></ul>
    </div>
  </div>
</header>

<main id="screen">
  <section id="board-area">
    <div id="board-wrap">
      <div id="board"></div>
      <div id="board-overlay" hidden></div>
    </div>
    <div id="board-status"><span class="turn-dot"></span><span id="status-text"></span></div>
    <div id="menu" class="overlay" hidden></div>
    <div id="library" class="overlay" hidden></div>
    <div id="help" class="overlay" hidden></div>
    <div id="stats" class="overlay" hidden></div>
  </section>

  <aside id="panel">
    <div id="cards"></div>
    <div id="context"></div>
    <div id="progress"></div>
    <div id="verdict"></div>
    <div id="actions"></div>
    <details id="tree-box">
      <summary>Line</summary>
      <div id="tree"></div>
    </details>
    <div id="editor" hidden></div>
  </aside>
</main>

<div id="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
